<!doctype html>
<html lang="es-AR" data-theme="owa">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Water Argentina · Temporada 2026/27</title>
    <meta
      name="description"
      content="Ocho fechas en río, lago y mar. Grand Prix, Circuito OWA, eventos especiales y los cruces de ultradistancia del OWA Challenge. El agua nos une."
    />
    <meta name="theme-color" content="#211e5f" />
    <link rel="icon" href="/brand/owa-iso-cyan.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/vito-wide-900.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/lato-400.woff2" as="font" type="font/woff2" crossorigin />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Open Water Argentina · Temporada 2026/27" />
    <meta property="og:description" content="Elegí tu próximo desafío. Ocho fechas, dos torneos puntuables y una comunidad que vuelve carrera tras carrera." />
    <meta property="og:image" content="/img/hero-drone-1250.webp" />
    <meta property="og:locale" content="es_AR" />

    <link rel="stylesheet" href="/src/styles/app.css" />
  </head>
  <body>
    <a
      href="#contenido"
      class="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-100 focus:rounded-full focus:bg-owa-cyan focus:px-5 focus:py-3 focus:font-display focus:text-xs focus:font-black focus:tracking-widest focus:text-owa-deep"
      >Ir al contenido</a
    >

    <!-- El pico de ola del branding, usado como máscara de las fotos de tarjeta -->
    <svg width="0" height="0" aria-hidden="true" class="absolute">
      <defs>
        <clipPath id="owa-pico-ola" clipPathUnits="objectBoundingBox">
          <path
            d="M0,0 L1,0 L1,0.9764 L0.40,0.9764 C0.34,0.9764 0.305,0.9623 0.27,0.934 C0.26,0.9245 0.255,0.9198 0.25,0.9198 C0.245,0.9198 0.24,0.9245 0.23,0.934 C0.195,0.9623 0.16,0.9764 0.10,0.9764 L0,0.9764 Z"
          />
        </clipPath>
        <!-- Misma ola, espejada: el pico queda del lado derecho de la tarjeta. -->
        <clipPath id="owa-pico-ola-derecha" clipPathUnits="objectBoundingBox">
          <path
            d="M1,0 L0,0 L0,0.9764 L0.60,0.9764 C0.66,0.9764 0.695,0.9623 0.73,0.934 C0.74,0.9245 0.745,0.9198 0.75,0.9198 C0.755,0.9198 0.76,0.9245 0.77,0.934 C0.805,0.9623 0.84,0.9764 0.90,0.9764 L1,0.9764 Z"
          />
        </clipPath>
        <!-- Misma ola, girada 90° e invertida: la foto invade el blanco del texto
             en vez de que el blanco entre en la foto. El borde real vive en 0.96
             (recorta el ancho de más que suma el margen negativo del lado);
             sólo en el pico central llega al borde entero (1.0), que es lo que
             asoma sobre el panel de texto. -->
        <clipPath id="owa-horizonte" clipPathUnits="objectBoundingBox">
          <path
            d="M0,0 L0.96,0 L0.96,0.42 C0.96,0.452 0.9700,0.4707 0.9900,0.4893 C0.9967,0.4947 1,0.4973 1,0.50 C1,0.5027 0.9967,0.5053 0.9900,0.5107 C0.9700,0.5293 0.96,0.548 0.96,0.58 L0.96,1 L0,1 Z"
          />
        </clipPath>
      </defs>
    </svg>

    <div id="shell"></div>
    <main id="contenido" class="bg-white text-owa-navy"></main>
    <div id="pie"></div>
    <div id="volver"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
